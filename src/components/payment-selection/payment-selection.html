<div class="pt-12 px-4 pb-24 flex flex-col items-center w-full">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden p-6 space-y-8 animate-fade-in">
    
    <!-- Header / Success Message -->
    <div class="text-center space-y-4">
      <div class="mx-auto w-16 h-16 bg-green-100 rounded-full flex items-center justify-center text-green-500 animate-bounce-subtle">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-gray-900 tracking-tight">Order Placed Successfully!</h2>
      <p class="text-gray-500 text-sm">Your order <span class="font-semibold text-gray-700">#{{ orderId() | slice:0:8 }}</span> has been sent to the kitchen.</p>
    </div>

    <!-- Payment Options -->
    <div class="space-y-4">
      <h3 class="text-lg font-medium text-gray-900 text-center">How would you like to pay?</h3>

      <!-- Error Message -->
      <div *ngIf="error()" class="bg-red-50 text-red-600 p-3 rounded-lg text-sm flex items-center gap-2">
        <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        {{ error() }}
      </div>

      <!-- Processing State -->
      <div *ngIf="isProcessing()" class="flex flex-col items-center justify-center py-6 space-y-3">
        <span class="loading loading-spinner loading-md text-primary"></span>
        <p class="text-sm text-gray-500">
          <ng-container [ngSwitch]="paymentStatus()">
            <span *ngSwitchCase="'creating'">Preparing payment...</span>
            <span *ngSwitchCase="'paying'">Waiting for payment...</span>
            <span *ngSwitchCase="'verifying'">Verifying payment...</span>
            <span *ngSwitchDefault>Processing...</span>
          </ng-container>
        </p>
      </div>

      <!-- Action Buttons -->
      <div *ngIf="!isProcessing()" class="space-y-3">
        
        <button 
          (click)="payWithRazorpay()"
          class="w-full relative group overflow-hidden bg-gray-900 text-white rounded-xl py-4 px-4 font-semibold transition-all hover:scale-[1.02] hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-gray-900 focus:ring-offset-2 flex justify-between items-center"
        >
          <span class="absolute inset-0 w-full h-full bg-white/20 transform -translate-x-full group-hover:translate-x-full transition-transform duration-500 ease-out"></span>
          <span class="relative flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
            Pay Now
          </span>
          <span class="relative">
            <svg class="w-5 h-5 opacity-70 group-hover:opacity-100 group-hover:translate-x-1 transition-all" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
          </span>
        </button>

        <div class="relative flex items-center py-2">
          <div class="flex-grow border-t border-gray-200"></div>
          <span class="flex-shrink-0 mx-4 text-gray-400 text-sm">or</span>
          <div class="flex-grow border-t border-gray-200"></div>
        </div>

        <button 
          (click)="selectCOD()"
          class="w-full bg-white text-gray-700 border-2 border-gray-200 rounded-xl py-4 px-4 font-semibold transition-all hover:border-gray-300 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-200 flex justify-between items-center"
        >
          <span class="flex items-center gap-2">
            <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
            Cash On Delivery
          </span>
        </button>
      </div>

    </div>
  </div>
</div>
