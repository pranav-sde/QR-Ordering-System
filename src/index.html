<!doctype html>
<html lang="en">

<head>
  <script>
    window.global = window;
    window.process = {
      env: { DEBUG: undefined },
    };
  </script>
  <meta charset="utf-8">
  <title>DineSphere</title>
  <base href="/">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#090A0F">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <script>
    // Dynamic Favicon Transparency Fix
    (function () {
      const img = new Image();
      img.src = 'assets/images/logo.png';
      img.crossOrigin = 'Anonymous';
      img.onload = function () {
        const canvas = document.createElement('canvas');
        // Standard high-res favicon size
        canvas.width = 128;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');

        // Use a temporary canvas to detect the bounding box of the non-black content
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = img.width;
        tempCanvas.height = img.height;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(img, 0, 0);

        const imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
        const data = imageData.data;

        // Simple logic to find the 'logo' bounds (non-black pixels)
        let minX = img.width, minY = img.height, maxX = 0, maxY = 0;
        let found = false;

        for (let y = 0; y < img.height; y++) {
          for (let x = 0; x < img.width; x++) {
            const i = (y * img.width + x) * 4;
            if (data[i] > 50 || data[i + 1] > 50 || data[i + 2] > 50) {
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
              found = true;
            }
          }
        }

        if (!found) { minX = 0; minY = 0; maxX = img.width; maxY = img.height; }

        // Add a tiny bit of padding
        const padding = 5;
        minX = Math.max(0, minX - padding);
        minY = Math.max(0, minY - padding);
        maxX = Math.min(img.width, maxX + padding);
        maxY = Math.min(img.height, maxY + padding);

        const width = maxX - minX;
        const height = maxY - minY;

        // Draw the cropped/zoomed logo to the final favicon canvas
        ctx.drawImage(img, minX, minY, width, height, 0, 0, canvas.width, canvas.height);

        // Apply transparency to any remaining dark pixels in the new canvas
        const finalData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const d = finalData.data;
        for (let i = 0; i < d.length; i += 4) {
          if (d[i] < 40 && d[i + 1] < 40 && d[i + 2] < 40) d[i + 3] = 0;
        }
        ctx.putImageData(finalData, 0, 0);

        const link = document.querySelector("link[rel*='icon']");
        if (link) {
          link.href = canvas.toDataURL('image/png');
        }
      };
    })();
  </script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Cookie&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('[SW] Registered:', reg.scope))
          .catch((err) => console.error('[SW] Registration failed:', err));
      });
    }

    // Capture beforeinstallprompt EARLY (before Angular boots)
    // Store it on window so PwaService can pick it up
    window.__pwaInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.__pwaInstallPrompt = e;
      console.log('[PWA] beforeinstallprompt captured early (before Angular)');
    });
  </script>
</head>

<body class="mat-typography">
  <app-root></app-root>
</body>

</html>
